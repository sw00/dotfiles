name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: dotfiles check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stow shellcheck fish tmux

      # Neovim 0.12+ is required for nvim-treesitter v1.0 + blink.cmp
      # (base/nvim). It cannot come from apt: the neovim-ppa/unstable package now
      # conflicts with the runner image's neovim-runtime and exits 100 before
      # check.sh runs. Upstream's release tarball is self-contained, so pin one
      # version here and skip the PPA entirely.
      - name: Install neovim
        env:
          NVIM_VERSION: v0.12.6
        run: |
          curl -fsSLo /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Run check.sh
        run: bash check.sh
