# ~/.mise.toml — mbpm3 (work laptop) host-specific tools
# Loaded by mise from $HOME and all subdirectories on this machine only.
# Stowed by hosts/mbpm3/mise/ package; not present on other hosts.
#
# These are deployment/infra tools used in a work context.
# Everyday k8s navigation tools (kubectl, k9s, kubectx, kubens) are global
# and live in base/mise/.config/mise/config.toml.
#
# Several tools below use mise's pypi backend (isolated venvs per tool):
#   azure → pypi:azure-cli   (registry default; was pipx: until mise switched)
#   pdm   → pypi:pdm         (registry default; was pipx: until mise switched)
# mise installs the backend automatically when needed — no separate Homebrew
# installation required. The switch was done with `mise uninstall --all X &&
# mise install X`; `mise backends switch` only works for lockfile-locked tools.

[tools]
helm       = "latest"
crane      = "latest"          # container registry ops (aqua:google/go-containerregistry)
kustomize  = "latest"
# kubeseal removed 2026-11 — superseded by External Secrets Operator.
# argocd/opentofu moved to workbench's .mise.toml (team-activated toolchain).
# stern/kail removed 2026-11: replaced by the kubectl plugin system. fly removed:
# workbench-managed (scripts/fly-install.sh, server-matched — not a host tool).
k3d        = "latest"          # local k3s clusters (was: asdf)
awscli     = "latest"          # AWS CLI (was: asdf)
azure      = "latest"          # resolves to pipx:azure-cli
pdm        = "latest"          # resolves to pipx:pdm

# ── Work CLI tools (moved from Homebrew — both in the aqua registry) ──────────
d2         = "latest"          # modern diagram scripting language (aqua:terrastruct/d2)
websocat   = "latest"          # WebSocket tool (aqua:vi/websocat)
oc         = "latest"          # OpenShift CLI — ARO/OpenShift work. Registry default
                               # backend is http:oc. Declared here so mise owns it and
                               # Homebrew's openshift-cli can go (one owner).
gcloud     = "latest"          # Google Cloud CLI (vfox:mise-plugins/vfox-gcloud). Used on
                               # this machine; was installed undeclared.
"npm:ntn"  = "latest"          # Notion CLI (`ntn`) — API requests, Workers, file uploads.
                               # Not in mise's registry and Notion publishes binaries
                               # only to its own CDN (ntn.dev/releases/…), so ubi: has no
                               # GitHub release to point at. The npm package is their
                               # supported non-self-managed channel: its preinstall
                               # fetches the platform binary, and `npm update -g` (i.e.
                               # `mise upgrade`) is the documented update path — the
                               # `curl ntn.dev | bash` installer self-manages via
                               # `ntn update`, which would leave a mise copy stale.
                               # Needs Node 22+/npm 10+ (already global in base mise).

