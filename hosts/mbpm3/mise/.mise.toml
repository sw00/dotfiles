# ~/.mise.toml — mbpm3 (work laptop) host-specific tools
# Loaded by mise from $HOME and all subdirectories on this machine only.
# Stowed by hosts/mbpm3/mise/ package; not present on other hosts.
#
# These are deployment/infra tools used in a work context.
# Everyday k8s navigation tools (kubectl, k9s, kubectx, kubens) are global
# and live in base/mise/.config/mise/config.toml.
#
# Several tools below use mise's pipx backend (isolated venvs per tool):
#   azure → pipx:azure-cli   (registry shorthand)
#   pdm   → pipx:pdm         (registry shorthand)
# mise installs the pipx backend automatically when needed — no separate
# Homebrew installation required.

[tools]
helm       = "latest"
kubeseal   = "latest"
crane      = "latest"          # container registry ops (aqua:google/go-containerregistry)
kustomize  = "latest"
argocd     = "latest"
opentofu   = "latest"
stern      = "latest"          # k8s log tailing (was: asdf)
k3d        = "latest"          # local k3s clusters (was: asdf)
awscli     = "latest"          # AWS CLI (was: asdf)
fly        = "8.3.0"           # Concourse CLI — PINNED to the server's API version.
                               # Do NOT float this: mise's `latest` runs ahead of
                               # the server, and fly refuses to talk to a
                               # mismatched API. Bump only when the server does.
azure      = "latest"          # resolves to pipx:azure-cli
pdm        = "latest"          # resolves to pipx:pdm

# ── Work CLI tools (moved from Homebrew — both in the aqua registry) ──────────
d2         = "latest"          # modern diagram scripting language (aqua:terrastruct/d2)
websocat   = "latest"          # WebSocket tool (aqua:vi/websocat)
oc         = "latest"          # OpenShift CLI — ARO/OpenShift work. Registry default
                               # backend is http:oc. Declared here so mise owns it and
                               # Homebrew's openshift-cli can go (one owner).
gcloud     = "latest"          # Google Cloud CLI (vfox:mise-plugins/vfox-gcloud). Used on
                               # this machine; was installed undeclared.

