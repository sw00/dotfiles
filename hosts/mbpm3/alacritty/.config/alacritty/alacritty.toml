[general]
import = ["~/.config/alacritty/base.toml"]

[terminal.shell]
# Use bash --login so Homebrew is on PATH (GUI apps don't source shell profiles).
# bash then exec-replaces itself with fish which activates mise shims before
# handing off to tmux.  Works on both Apple Silicon and Intel Macs.
program = "/bin/bash"
args    = ["--login", "-c", "exec fish -c 'tmux new-session -As 0'"]

[font]
size = 12.0

[window]
decorations    = "full"
option_as_alt  = "OnlyLeft"  # left Option → Alt in terminal

# ── Keyboard bindings ────────────────────────────────────────────────────────
# Alt+Enter → CSI-u for pi (follow-up queueing).  macOS Alacritty otherwise
# sends plain Return when option_as_alt is active, so pi can't see the chord.
[[keyboard.bindings]]
key   = "Return"
mods  = "Alt"
chars = "\u001b[13;3u"

# Alt+Shift+Enter → fullscreen.  Moved from Alt+Enter to free that chord for pi.
[[keyboard.bindings]]
key    = "Return"
mods   = "Alt | Shift"
action = "ToggleSimpleFullscreen"

[[hints.enabled]]
command         = "open"
hyperlinks      = true
post_processing = true
persist         = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key  = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
# Shift+Click to open URLs.  Shift bypasses tmux mouse-tracking so the
# click reaches Alacritty instead of being swallowed for pane selection.
# Plain clicks (no Shift) always belong to tmux.
mods    = "Shift"
