#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Only surface tmux sessions and hand-configured sessions when `sesh list`
# is called without extra flags.  Omitting "zoxide" here does NOT exclude it
# from the list — zoxide results still appear but are shown last, after the
# sources you care about.  The real filtering lives elsewhere now: C-o is a
# sessions-only switcher (`sesh list -t | grep -Fxv`, tmux.conf), and the
# ~/src zoxide scoping is done by C-f via base/tmux/bin/repo-list.
sort_order = ["tmux", "config", "zoxide"]

# Apply a default startup command to every repo under ~/src/.
# Adjust the startup_command to whatever you want (nvim, fish, etc.).
[[wildcard]]
pattern = "~/src/*"
startup_command = "nvim"

# Curated projects outside ~/src/. These appear in `sesh list -c` and are
# pinned at the top of the C-f picker (see tmux.conf), before ~/src repos.
[[session]]
name = "dotfiles"
path = "~/dotfiles"
startup_command = "nvim"

[[session]]
name = "scratch"
path = "~/tmp/scratch"
