# ~/.config/mise/config.toml
# CLI tools and language runtimes — all platforms (macOS, Linux, WSL2).
# This is the single source of truth for Level 2/3 tooling.
# OS package managers (brew/apt/winget) handle Level 1 only.
# Docs: https://mise.jdx.dev/configuration.html

# ── Core CLI tools ────────────────────────────────────────────────────────────
[tools]
neovim      = "latest"
fzf         = "latest"
fd          = "latest"
ripgrep     = "latest"
bat         = "latest"
delta       = "latest"
jq          = "latest"
yq          = "latest"
zoxide      = "latest"
direnv      = "latest"
shellcheck  = "latest"
shfmt       = "latest"   # shell formatter — pairs with shellcheck (aqua:mvdan/sh)
pre-commit  = "latest"
lazygit     = "latest"
git-lfs     = "latest"

# ── Terminal / shell ──────────────────────────────────────────────────────────
# tmux replaces apt/brew tmux; uniform version across all platforms.
# tmux-fingers is handled by TPM (see tmux.conf); not needed here.
tmux              = "latest"
# sesh (smart session manager) and lf (file manager) have no core registry
# entry; the ubi backend installs their prebuilt GitHub release binaries.
"ubi:joshmedeski/sesh" = "latest"
"ubi:gokcehan/lf"      = "latest"
mutagen          = "latest"   # two-way file sync over SSH (aqua:mutagen-io/mutagen)

# ── Devops — everyday k8s navigation ─────────────────────────────────────────
kubectl  = "latest"
k9s      = "latest"
kubectx  = "latest"
kubens   = "latest"
lnav     = "latest"
tflint   = "latest"   # terraform linter (aqua:terraform-linters/tflint)
# Deployment/infra tools are work-laptop specific:
# see hosts/mbpm3/mise/.mise.toml for helm, kubeseal, crane, kustomize, argocd, opentofu

# ── Language runtimes ─────────────────────────────────────────────────────────
# Pin to a minor, let mise pick the patch. Update intentionally.
node    = "22"
python  = "3.12.13"
uv = "latest"
github-cli = "latest"
"pipx:httpie" = "latest"
bitwarden-secrets-manager = "latest"
# The Bitwarden CLI (bw). aqua:bitwarden/clients. Declared so it has ONE owner:
# it was installed undeclared while an npm global @bitwarden/cli also existed,
# and the npm copy won — which meant `bw` would vanish on the next Node
# re-provision (mise only installs default-node-packages when it provisions).
bitwarden = "latest"
# pi and claude are deliberately NOT mise-managed (see AGENTS.md: self-updating
# apps with their own managed install own themselves).  mise only re-resolves
# `latest` when `mise upgrade` runs, and its install dirs precede ~/.local/bin on
# PATH, so a mise copy both goes stale and shadows the self-updating entrypoint.
# Neither updater will touch one: pi classifies installs by path and refuses an
# aqua-extracted binary ("cannot self-update this installation"), and Claude Code
# only updates its native layout under ~/.local/share/claude.  Both install
# themselves instead (ensure_pi/ensure_claude in bootstrap.sh, which also keep
# them on latest); check.sh fails if either entry reappears here.  Do not re-add.
"npm:tokscale" = "latest"
"pipx:cerebrium" = "latest"
# terravision has no registry entry under its bare name; the pipx backend is how
# it is actually installed, so it has to be spelled out.
"pipx:terravision" = "latest"
"pipx:python-dotenv" = "latest"
"ubi:rikorose/DeepFilterNet" = "latest"
"npm:ccusage" = "latest"
"aqua:grafana/gcx" = "latest"
# gitleaks backs the publish guard (class c: a credential riding out inside a
# `gh pr create --body`). The guard fails CLOSED when it cannot find a scanner,
# so this entry is load-bearing: without it every publish and web call blocks
# with "gitleaks not installed".
"aqua:gitleaks/gitleaks" = "latest"
# worktrunk (`wt`) owns git worktrees — contract and daily verbs in docs/WT.md.
# PINNED, not `latest`: 0.82.0 is signed by a release-recovery tag and fails mise's
# cosign verification outright, so `latest` breaks `mise install` on every host.
# 0.81.0 also has no `refs/wt-backup`, which is why docs/WT.md forbids `wt remove
# --force`. Move the pin only when aqua's `latest` installs clean.
"aqua:max-sixty/worktrunk" = "0.81.0"
# btop: aqua ships linux builds only; macOS has no prebuilt binary for any mise
# backend, so it comes from brew instead (os/macos/brew/.Brewfile-base). The
# os restriction makes mise skip it on macOS rather than fail on aqua.
[tools.btop]
version = "latest"
os = ["linux"]

# navi: same shape as btop, and the reason it sat declared-but-missing for so
# long — aqua:denisidoro/navi publishes linux and windows/amd64 only, so
# `mise install navi` fails outright on Apple Silicon. macOS takes it from brew
# via the same os restriction.
[tools.navi]
version = "latest"
os = ["linux"]

# PiG (MichaelKinsy/PiG, pi-in-go.dev) — the pi-compatible Go harness this repo
# provisions; `pi-use pig` makes it the `pi` on PATH.  It is mise-managed
# precisely BECAUSE of the note above: it has no self-updater, so unlike pi and
# claude it has one owner and that owner is mise.
#
# PINNED to an exact version, unlike every neighbour here.  An upgrade swaps the
# harness under the prompts this repo ships, so the pin may only move in a
# reviewable commit that is paired with the pi-smoke / PROMPT-EVAL pass —
# `agents-update` runs `mise upgrade --bump` on this entry for exactly that
# reason (it rewrites the line below; the diff is the review).  A floating
# `latest` would move it silently on the next `mise upgrade`.
#
# `exe` is required, not cosmetic: ubi looks for an archive member matching the
# repo name and the release ships the binary as `pig`, so without it install
# fails with "could not find any files matching [PiG*]" (verified 2026-11-16).
[tools."ubi:MichaelKinsy/PiG"]
version = "0.7.0"
exe = "pig"

# Uncomment when needed on a project:
# go     = "latest"
# rust   = "latest"
# elixir = "latest"
# ruby   = "3.3"
# java   = "temurin-21"

# ── Settings ─────────────────────────────────────────────────────────────────
[settings]
# Python packages needed by tools (tmux plugins, scripts, etc.) — not projects.
# Installed automatically whenever mise provisions a new Python version.
# Add packages here rather than running pip manually or using venvs for tools.
python.default_packages_file = "~/.config/mise/default-python-packages"

# npm packages installed globally into the mise-managed Node for tool use.
# NOT for project dependencies — use a per-project package.json for those.
# Installed automatically whenever mise provisions a new Node version.
# Add packages here rather than running npm install -g manually.
node.default_packages_file   = "~/.config/mise/default-node-packages"
