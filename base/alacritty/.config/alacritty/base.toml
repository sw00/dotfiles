# base.toml — shared Alacritty configuration, imported by every platform and
# host config.
#
# Covers everything that is the same across macOS, Linux, and Windows/WSL:
# font family, colors, window chrome, cursor, scrollback, hints, and bindings.
#
# THE CHAIN is base → platform → host, and each layer owns what its OS forces:
#   os/linux, os/wsl   terminal.shell, the hint opener, plus the defaults those
#                      platforms share (font.size, window.decorations)
#   hosts/<host>       genuine per-machine facts: font.size for the display,
#                      window.option_as_alt, a keyboard binding
# macOS has NO platform layer (there is one macOS host), so hosts/mbpm3 carries
# the platform facts — terminal.shell, decorations — beside its own. A second
# macOS host should get os/macos/alacritty FIRST, so the shell chain is written
# once instead of copied per machine.
#
# IMPORT SPELLING differs by layer on purpose, and "normalising" it breaks the
# Windows copy: `~/.config/alacritty/base.toml` where stow lays both files down
# in that directory, and a bare `base.toml` under WSL, where os/wsl/up.sh copies
# the pair into %APPDATA%\Alacritty\ and only the relative form resolves.

# ── Font ─────────────────────────────────────────────────────────────────────
[font]
# CaskaydiaCove Nerd Font Mono installed by bootstrap.sh / up.sh on all platforms.
normal      = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular"     }
bold        = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold"        }
italic      = { family = "CaskaydiaCove Nerd Font Mono", style = "Italic"      }
bold_italic = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold Italic" }
# size set per platform/host
builtin_box_drawing = true

# ── Window ───────────────────────────────────────────────────────────────────
[window]
padding        = { x = 8, y = 8 }
dynamic_padding = false
opacity        = 1.0
blur           = false
dynamic_title  = true
# decorations set per platform/host; option_as_alt per host

# ── Scrollback ───────────────────────────────────────────────────────────────
[scrolling]
history    = 10000
multiplier = 3

# ── Cursor ───────────────────────────────────────────────────────────────────
[cursor]
style            = { shape = "Block", blinking = "Off" }
vi_mode_style    = "None"   # inherits cursor.style in vi mode
unfocused_hollow = true
thickness        = 0.15

# ── Mouse ────────────────────────────────────────────────────────────────────
[mouse]
hide_when_typing = true

# ── Selection ────────────────────────────────────────────────────────────────
[selection]
save_to_clipboard    = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# ── Terminal ─────────────────────────────────────────────────────────────────
[terminal]
# Allow OSC 52 copy (e.g. tmux copy to system clipboard); never paste.
osc52 = "OnlyCopy"
# shell is set per-host under [terminal.shell]

# ── Bell ─────────────────────────────────────────────────────────────────────
[bell]
animation = "Linear"
duration  = 0          # 0 = visual bell disabled; set >0 to enable

# ── Colors ───────────────────────────────────────────────────────────────────
# Inherit Alacritty's built-in default theme. Re-enable a [colors] block here
# only when a value genuinely differs from the built-in defaults.

# ── Keyboard bindings ───────────────────────────────────────────────────────
# Shift+Enter → distinct CSI-u sequence so tmux and pi can tell it apart
# from plain Enter (which submits).  Without this, Alacritty sends \r for
# both, and pi's "shift+enter → newline" default can't fire.
[[keyboard.bindings]]
key  = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# ── URL hints ────────────────────────────────────────────────────────────────
# Defined per-platform/host because the open command differs:
#   macOS:        open
#   Linux/WSL:    xdg-open
#   Windows:      cmd.exe /c start
# Each platform config adds its own [[hints.enabled]] block.
